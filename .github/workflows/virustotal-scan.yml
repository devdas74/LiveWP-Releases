name: Publish VirusTotal scan status

on:
  release:
    types: [published]
  workflow_dispatch:
  push:
    branches:
      - Stable
    paths:
      - ".github/scripts/virustotal_scan.py"
      - ".github/workflows/virustotal-scan.yml"

permissions:
  contents: write

concurrency:
  group: livestagix-release-virustotal
  cancel-in-progress: false

jobs:
  scan:
    name: Verify and scan the published APK
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out the Stable release branch
        uses: actions/checkout@v4
        with:
          ref: Stable

      - name: Validate scanner script syntax
        run: python3 -m py_compile .github/scripts/virustotal_scan.py

      - name: Check whether VirusTotal API key is configured
        id: api-key
        shell: bash
        env:
          VT_API_KEY: ${{ secrets.VIRUSTOTAL_API_KEY }}
        run: |
          if [[ -n "$VT_API_KEY" ]]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::VirusTotal scanning is not configured. Add the VIRUSTOTAL_API_KEY Actions secret to enable automatic scans."
          fi

      - name: Verify APK, submit to VirusTotal and save report metadata
        if: steps.api-key.outputs.configured == 'true'
        env:
          VT_API_KEY: ${{ secrets.VIRUSTOTAL_API_KEY }}
        run: python3 .github/scripts/virustotal_scan.py

      - name: Publish scan metadata on Stable
        if: success() && steps.api-key.outputs.configured == 'true'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add security/scan-status.json
          if git diff --cached --quiet; then
            echo "No scan-status update to commit."
            exit 0
          fi
          git commit -m "Publish VirusTotal scan status"
          git push origin HEAD:Stable
